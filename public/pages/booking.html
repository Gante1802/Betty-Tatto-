<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reserva tu cita</title>
    <link rel="stylesheet" href="assets/css/bookingstyle.css" />
  </head>

  <body>
    <form id="booking-form" class="form-container">
      <h2 class="title">Reserva tu cita</h2>

      <!-- TIPO -->
      <div class="field">
        <label>Tipo de cita</label>
        <select id="type" name="type" required>
          <option value="">Selecciona una opción</option>
          <option value="flash">Flash</option>
          <option value="custom">Personalizado</option>
        </select>
      </div>

      <hr />

      <!-- DATOS -->
      <div class="section">
        <h3>Datos personales</h3>

        <div class="field">
          <label>Nombre</label>
          <input type="text" name="name" placeholder="Tu nombre" required />
        </div>

        <div class="field">
          <label>Contacto (Instagram o WhatsApp)</label>
          <input
            type="text"
            name="contact"
            placeholder="@instagram o número"
            required
          />
        </div>
      </div>

      <hr />

      <!-- FLASH -->
      <div id="flashFields" class="section hidden">
        <h3>Flash Tattoo ⚡</h3>

        <div class="field">
          <label>Nota opcional</label>
          <textarea
            name="flashNote"
            placeholder="Algo que quieras añadir..."
          ></textarea>
        </div>
      </div>

      <!-- CUSTOM -->
      <div id="customFields" class="section hidden">
        <h3>Personalizado 🎨</h3>

        <div class="field">
          <label>Idea del tatuaje</label>
          <textarea name="idea" placeholder="Describe tu idea..."></textarea>
        </div>

        <div class="field">
          <label>Ubicación del cuerpo</label>
          <input
            type="text"
            name="placement"
            placeholder="Brazo, pierna, espalda..."
          />
        </div>

        <div class="field">
          <label>Referencias</label>
          <textarea
            name="references"
            placeholder="Links o descripción visual"
          ></textarea>
        </div>
      </div>

      <hr />

      <button id="subbmit-btn" type="submit" class="btn">
        Enviar solicitud
      </button>
    </form>
  </body>

  <script src="/assets/js/bookingscript.js"></script>
</html>
