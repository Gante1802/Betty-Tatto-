<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reserva tu cita</title>
    <link rel="stylesheet" href="/public/assets/css/bookingstyle.css" />
  </head>

  <body>
    <form method="POST" id="booking-form" class="form-container">
      <h2 class="title">Reserva tu cita</h2>

      <!-- TIPO -->
      <div class="field">
        <label>Tipo de cita</label>
        <select id="type" name="type" required>
          <option value="">Selecciona una opción</option>
          <option value="flash">Flash</option>
          <option value="custom">Personalizado</option>
        </select>
      </div>

      <hr />

      <!-- DATOS -->
      <div class="section">
        <h3>Datos personales</h3>

        <div class="field">
          <label>Nombre</label>
          <input type="text" name="name" placeholder="Tu nombre" required />
        </div>

        <div class="field">
          <label>Metodo de contacto</label>
          <div class="contact-methods">
            <label>
              <input type="radio" name="contactMethod" value="email" required />
              Correo
            </label>
            <label>
              <input type="radio" name="contactMethod" value="whatsapp" />
              WhatsApp
            </label>
          </div>
        </div>

        <div id="emailField" class="field hidden">
          <label>Correo</label>
          <input
            type="email"
            name="email"
            placeholder="tucorreo@ejemplo.com"
            disabled
          />
        </div>

        <div id="whatsappField" class="field hidden">
          <label>WhatsApp</label>
          <input
            type="tel"
            name="whatsapp"
            placeholder="Tu numero de WhatsApp"
            disabled
          />
        </div>
      </div>

      <hr />

      <!-- FLASH -->
      <div id="flashFields" class="section hidden">
        <h3>Flash Tattoo ⚡</h3>

        <div class="field">
          <label>Elige uno de los flash publicados</label>
          <div id="flash-options" class="flash-options"></div>
        </div>

        <div
          id="flash-selection-details"
          class="flash-selection-details hidden"
        >
          <p class="flash-selection-label">Flash seleccionado</p>
          <h4 id="flash-selection-title"></h4>
          <p id="flash-selection-description"></p>
          <p id="flash-selection-price" class="flash-selection-price"></p>
        </div>
      </div>

      <!-- CUSTOM -->
      <div id="customFields" class="section hidden">
        <h3>Personalizado 🎨</h3>

        <div class="field">
          <label>Idea del tatuaje</label>
          <textarea name="idea" placeholder="Describe tu idea..."></textarea>
        </div>

        <div class="field">
          <label>Ubicación del cuerpo</label>
          <select name="placement" required>
            <option value="">Selecciona una opción</option>
            <option value="brazo">Brazo</option>
            <option value="pierna">Pierna</option>
            <option value="espalda">Espalda</option>
            <option value="pecho">Pecho</option>
            <option value="manos">Manos</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div class="field">
          <label>Tamaño aproximado</label>
          <input type="text" name="size" placeholder="Tamaño en centímetros" />
        </div>

        <div class="field">
          <label>Color</label>
          <input type="radio" name="color" value="black_and_white" /> Blanco y
          negro <input type="radio" name="color" value="color" /> Color
        </div>

        <div class="field">
          <label>Estilo</label>
          <input
            type="text"
            name="style"
            placeholder="Realismo, tradicional, minimalista..."
          />
        </div>

        <div class="field">
          <label>Referencias</label>
          <input
            type="file"
            name="references"
            placeholder="Links o descripción visual"
          />
        </div>
      </div>

      <hr />

      <button id="subbmit-btn" type="submit" class="btn">
        Enviar solicitud
      </button>
    </form>
  </body>

  <script src="/public/assets/js/flashcatalog.js"></script>
  <script src="/public/assets/js/bookingscript.js"></script>
</html>
