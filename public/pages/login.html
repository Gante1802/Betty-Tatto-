<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Betty Tattoo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=UnifrakturCook:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/public/assets/css/login.css" />
  </head>
  <body>
    <main class="login-shell">
      <h1 class="brand">Betty Tattoo</h1>
      <p class="subtitle">Ingresa como cliente o como administradora.</p>

      <div class="credentials">
        <span>Admin Betty: bettyadmin / betty123</span>
        <span>Admin Diego: diegoadmin / diego123</span>
      </div>

      <div
        class="auth-switch"
        role="tablist"
        aria-label="Selector de autenticacion"
      >
        <button
          id="tab-login"
          type="button"
          class="tab-button active"
          role="tab"
          aria-selected="true"
        >
          Iniciar sesion
        </button>
        <button
          id="tab-register"
          type="button"
          class="tab-button"
          role="tab"
          aria-selected="false"
        >
          Registrarse
        </button>
      </div>

      <form id="login-form" class="auth-form" autocomplete="on">
        <label for="login-username">
          Usuario
          <input id="login-username" name="username" type="text" required />
        </label>

        <label for="login-password">
          Password
          <input id="login-password" name="password" type="password" required />
        </label>

        <button type="submit">Iniciar sesion</button>
      </form>

      <form id="register-form" class="auth-form hidden" autocomplete="on">
        <label for="register-displayName">
          Nombre
          <input
            id="register-displayName"
            name="displayName"
            type="text"
            required
          />
        </label>

        <label for="register-username">
          Usuario
          <input id="register-username" name="username" type="text" required />
        </label>

        <label for="register-password">
          Password
          <input
            id="register-password"
            name="password"
            type="password"
            minlength="6"
            required
          />
        </label>

        <button type="submit">Crear cuenta</button>
      </form>

      <p id="feedback" class="feedback"></p>

      <a class="back-link" href="/">Volver al inicio</a>
    </main>

    <script src="/public/assets/js/login.js"></script>
  </body>
</html>
