<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Betty Tattoo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=UnifrakturCook:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/public/assets/css/login.css" />
  </head>
  <body>
    <main class="login-shell">
      <h1 class="brand">Betty Tattoo</h1>
      <p class="subtitle">Ingresa como cliente o como administradora.</p>

      <div class="credentials">
        <span>Demo usuario: cliente / cliente123</span>
        <span>Demo admin: bettyadmin / betty123</span>
      </div>

      <form id="login-form" autocomplete="on">
        <label for="username">
          Usuario
          <input id="username" name="username" type="text" required />
        </label>

        <label for="password">
          Password
          <input id="password" name="password" type="password" required />
        </label>

        <button type="submit">Iniciar sesion</button>
      </form>

      <p id="feedback" class="feedback"></p>

      <a class="back-link" href="/">Volver al inicio</a>
    </main>

    <script src="/public/assets/js/login.js"></script>
  </body>
</html>
