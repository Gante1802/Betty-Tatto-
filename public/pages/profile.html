<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil | Betty Tattoo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/public/assets/css/profile.css" />
  </head>
  <body>
    <main class="card">
      <section class="profile-section">
        <h2 id="welcome">Hola</h2>
        <p id="user-role"></p>
        <p id="user-name"></p>
      </section>

      <div class="actions">
        <a href="/public/pages/booking.html">Reservar cita</a>
        <a href="/public/index.html">Volver al inicio</a>
        <button id="logout-btn" type="button">Cerrar sesion</button>
      </div>

      <section class="status-section">
        <h1>Estado de tu solicitud</h1>
        <p id="status-intro" class="status-intro">Cargando tu solicitud...</p>

        <article id="current-booking" class="current-booking hidden">
          <header class="current-booking-head">
            <h2 id="booking-title">Solicitud activa</h2>
            <span id="booking-status" class="status-badge">Pendiente</span>
          </header>
          <p id="booking-date"></p>
          <p id="booking-type"></p>
          <p id="booking-contact"></p>
          <p id="booking-admin-comment"></p>
          <p id="booking-admin-price"></p>
          <p id="booking-updated-at" class="booking-updated-at"></p>
        </article>

        <article id="no-booking" class="no-booking hidden">
          <p>
            Aun no tienes solicitudes. Crea tu primera reserva y aqui veras su
            estado.
          </p>
        </article>
      </section>
    </main>

    <script src="/public/assets/js/profile.js"></script>
  </body>
</html>
